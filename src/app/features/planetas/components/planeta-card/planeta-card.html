@let p = planeta();

<article class="overflow-hidden rounded-xl border border-stone-200 bg-white shadow-sm">
    <div class="relative bg-ki-50 p-4">
        @if (p.isDestroyed) {
            <span class="absolute top-3 right-3 rounded-full bg-red-600 px-2 py-0.5 text-xs font-semibold text-white">
                Destruido
            </span>
        }

        <img [src]="p.image" [alt]="p.name" class="h-40 w-full object-contain"/>
    </div>

    <div class="p-4">
        <h3 class="text-lg font-semibold">{{p.name}}</h3>
        <p class="line-clamp-4 text-sm text-stone-600">{{p.description}}</p>
    </div>

</article>

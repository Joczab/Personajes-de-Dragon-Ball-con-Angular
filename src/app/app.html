<header class="bg-capsula-900 text-white">
  <div class="mx-auto flex max-w-6xl items-center gap-3 px-6 py-5">
    <span class="grid size-11 place-items-center rounded-full bg-ki-500 text-capsula-900">
      <svg lucideZap class="size-6"></svg>
    </span>
    <div>
      <h1 class="text-2xl font-bold tracking-tight">{{ titulo() }}</h1>
      <p class="text-sm text-white/70">{{ personajes().length }} personajes cargados</p>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-6 py-8">
  <ul class="grid gap-2">
    @for (p of personajes(); track p.id) {
      <li class="flex items-center gap-3 rounded-lg border border-stone-200 bg-white p-2">
        <img [src]="p.image" [alt]="p.name" class="size-12 rounded-full bg-ki-100 object-contain" />
        <strong>{{ p.name }}</strong>
        <span class="text-stone-500">{{ p.race }}</span>
      </li>
    } @empty {
      <li class="text-stone-500">No hay personajes.</li>
    }
  </ul>
</main>

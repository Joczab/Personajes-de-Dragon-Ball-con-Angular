<header class="bg-capsula-900 text-white">
  <div class="mx-auto flex max-w-6xl items-center gap-3 px-6 py-5">
    <span class="grid size-11 place-items-center rounded-full bg-ki-500 text-capsula-900">
      <svg lucideZap class="size-6"></svg>
    </span>
    <div>
      <h1 class="text-2xl font-bold tracking-tight">{{ titulo() }}</h1>
      <p class="text-sm text-white/70">{{ personajes().length }} personajes cargados</p>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-6 py-8">
  <!--
    Grilla clásica (CSS Grid): columnas del mismo ancho y filas alineadas.
    grid-cols-2 en móvil, sm:grid-cols-3 en tablet, lg:grid-cols-4 en escritorio.
    Las variantes sm: y lg: son "mobile first": se aplican desde ese ancho hacia arriba.
  -->
  <section class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
    @for (p of personajes(); track p.id) {
      <app-personaje-card [personaje]="p" />
    } @empty {
      <p class="col-span-full text-stone-500">No hay personajes.</p>
    }
  </section>
</main>
